# Vorübergehend: prüft die Märkte-Abrufe in der Action, veröffentlicht nichts. Wird vor dem Merge entfernt.
name: Test Märkte (vorübergehend)
on:
  push:
    branches: [ccr-7afcbd8d-mrny8u]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/daten-holen.mjs
      - run: cat data/maerkte.json; echo; cat data/boersenplaetze.json; echo; cat data/status.json
