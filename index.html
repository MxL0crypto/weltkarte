<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weltkarte</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --panel: #111;
  --panel-hell: #1a1a1a;
  --rand: #262626;
  --rand-hell: #3a3a3a;
  --text: #d4d4d4;
  --text-schwach: #7c7c7c;
  --gruen: #3ee07a;
  --hoch: #ff4545;
  --erhoeht: #ff9f1c;
  --beobachtung: #ffd60a;
  --grau: #555;
  --plus: #3ee07a;   /* Märkte: im Plus / im Minus (eigene Färbung, nicht die Stufen) */
  --minus: #ff4545;
  --schrift: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--text); font: 12px/1.45 var(--schrift);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gruen); outline-offset: 1px; }
h1, h2 { margin: 0; font-size: inherit; }

/* Kopfzeile */
.kopf {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 20px;
  padding: 10px 14px; border-bottom: 1px solid var(--rand); background: var(--panel);
}
.kopf h1 { font-size: 15px; font-weight: 700; letter-spacing: .18em; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--gruen); font-weight: 600; }
.live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.live.alt { color: var(--grau); }
.alter { color: var(--text-schwach); }
.uhren { margin-left: auto; display: flex; gap: 16px; color: var(--text-schwach); }
.uhren b { color: var(--text); font-weight: 600; }

/* Hauptbereich */
.haupt { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 380px; }
.kartenbereich { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--rand); }
.leiste {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-bottom: 1px solid var(--rand);
}
.titel { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.karte-huelle { position: relative; flex: 1; min-height: 0; }
#karte { position: absolute; inset: 0; }

/* Knöpfe */
.gruppe { display: flex; border: 1px solid var(--rand); background: var(--panel); }
.gruppe button, .kartenknoepfe button {
  min-width: 34px; padding: 6px 9px; border: 0; background: transparent; color: var(--text-schwach);
}
.gruppe button + button { border-left: 1px solid var(--rand); }
.gruppe button:hover, .kartenknoepfe button:hover { color: var(--text); background: var(--panel-hell); }
.gruppe button[aria-pressed="true"] { background: var(--gruen); color: #04140a; font-weight: 700; }

.zeitfilter { position: absolute; top: 10px; left: 10px; }
.kartenknoepfe { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; }
.kartenknoepfe button {
  width: 32px; height: 32px; padding: 0; font-size: 16px;
  border: 1px solid var(--rand); background: var(--panel); color: var(--text);
}

/* Ebenen-Panel */
.ebenen {
  position: absolute; left: 10px; bottom: 40px; width: 270px; max-height: calc(100% - 100px);
  display: flex; flex-direction: column; border: 1px solid var(--rand); background: rgba(14,14,14,.95);
}
.ebenen-kopf {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  padding: 8px 10px; border: 0; background: none; font-weight: 700; letter-spacing: .12em;
}
.ebenen-kopf::after { content: '▾'; color: var(--text-schwach); }
.ebenen-kopf[aria-expanded="false"]::after { content: '▸'; }
.ebenen ul { list-style: none; margin: 0; padding: 0 0 6px; overflow-y: auto; border-top: 1px solid var(--rand); }
.ebene { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 5px 10px; }
.ebene label { display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: .04em; }
.ebene input { accent-color: var(--gruen); width: 14px; height: 14px; margin: 0; }
.ebene svg { width: 13px; height: 13px; flex: none; fill: currentColor; }
.anzahl { color: var(--text-schwach); }
.ebene.leer label, .ebene.leer .anzahl { color: var(--grau); }
.info-knopf {
  width: 18px; height: 18px; padding: 0; border: 1px solid var(--rand-hell); border-radius: 50%;
  background: none; font-size: 10px; color: var(--text-schwach);
}
.info-knopf[aria-expanded="true"] { border-color: var(--gruen); color: var(--gruen); }
.info-text { grid-column: 1 / -1; margin: 2px 0 4px; color: var(--text-schwach); }

/* Legende + Quellenangaben */
.legende {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 5px 10px;
  border: 1px solid var(--rand); background: rgba(14,14,14,.92); white-space: nowrap;
}
.legende b { letter-spacing: .1em; }
.legende span::before {
  content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; background: var(--f);
}
.maplibregl-ctrl-attrib { background: rgba(10,10,10,.75) !important; color: var(--text-schwach); font: 10px var(--schrift); }
.maplibregl-ctrl-attrib a { color: var(--text-schwach); }
.maplibregl-ctrl-attrib-button { filter: invert(1); }

/* Popup */
.maplibregl-popup-content {
  padding: 10px 26px 10px 12px; border: 1px solid var(--rand-hell); border-radius: 0;
  background: var(--panel); color: var(--text); font: 12px/1.45 var(--schrift);
}
.maplibregl-popup { z-index: 2; } /* über Ebenen-Panel und Legende */
.maplibregl-popup-tip { display: none; }
.maplibregl-popup-close-button { width: 24px; height: 24px; color: var(--text-schwach); font-size: 16px; }
.popup h3 { margin: 0 0 6px; font-size: 13px; border-left: 3px solid var(--f); padding-left: 7px; }
.popup p { margin: 3px 0; }
.popup .zeit, .popup .quelle { color: var(--text-schwach); }
.popup a { color: var(--gruen); }

/* Rechte Spalte */
.spalte { overflow-y: auto; }
.panel { border-bottom: 1px solid var(--rand); }
.panel-kopf {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px;
  border: 0; background: var(--panel); font-weight: 700; letter-spacing: .12em; text-align: left;
}
.panel-kopf::after { content: '▾'; margin-left: auto; color: var(--text-schwach); }
.panel-kopf[aria-expanded="false"]::after { content: '▸'; }
.zahl { color: var(--hoch); font-weight: 600; letter-spacing: 0; }
.zahl::before { content: '● '; font-size: 9px; vertical-align: 1px; }
.neueste { list-style: none; margin: 0; padding: 0; }
.ereignis {
  display: block; width: 100%; padding: 8px 12px 8px 10px; text-align: left;
  border: 0; border-left: 3px solid var(--f); border-top: 1px solid var(--rand); background: none;
}
.ereignis:hover { background: var(--panel-hell); }
.ereignis span { display: block; color: var(--text-schwach); font-size: 11px; margin-top: 2px; }
.leer-hinweis { padding: 12px; color: var(--text-schwach); }

/* Live-Nachrichten: Stufen-Punkt statt Farbbalken, Liste scrollt für sich */
.filter { margin: 0 12px 10px; width: max-content; max-width: calc(100% - 24px); }
.nachrichten { max-height: 45vh; overflow-y: auto; border-top: 1px solid var(--rand); }
.nachrichten li:first-child .ereignis { border-top: 0; }
.meldung { position: relative; padding-left: 26px; border-left: 0; color: inherit; text-decoration: none; }
.meldung::before { content: ''; position: absolute; left: 10px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--f); }
.haufen { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
.haufen li { padding: 5px 0; border-top: 1px solid var(--rand); }
.haufen a { border-left: 3px solid var(--f); padding-left: 6px; display: block; color: var(--text); text-decoration: none; }
.haufen a:hover { color: var(--gruen); }
.haufen span { display: block; padding-left: 9px; color: var(--text-schwach); font-size: 11px; }

/* Märkte */
.maerkte { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rand); }
.wert {
  display: grid; grid-template-columns: minmax(0, 1fr) 56px auto 68px; align-items: center; gap: 8px;
  padding: 6px 12px; border-top: 1px solid var(--rand);
}
.wert:first-child { border-top: 0; }
.wert svg { width: 56px; height: 18px; fill: none; stroke-width: 1.5; }
.kurs, .aenderung { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kurs small { color: var(--text-schwach); font-size: 10px; }
.plus { color: var(--plus); }
.minus { color: var(--minus); }
.kleingedruckt { margin: 0; padding: 6px 12px 10px; border-top: 1px solid var(--rand); color: var(--text-schwach); font-size: 10px; }

/* Handy */
@media (max-width: 799px) {
  body { height: auto; overflow: auto; }
  .haupt { display: block; }
  .kartenbereich { height: 60vh; border-right: 0; border-bottom: 1px solid var(--rand); }
  .uhren { margin-left: 0; width: 100%; }
  /* Unten ist die Quellenangabe, darum Legende und Ebenen oben links unter dem Zeitfilter */
  .legende { top: 48px; bottom: auto; left: 10px; transform: none; font-size: 11px; }
  .ebenen { top: 86px; bottom: auto; width: auto; max-width: calc(100% - 70px); max-height: calc(100% - 96px); }
}
</style>
</head>
<body>
<header class="kopf">
  <h1>WELTKARTE</h1>
  <span class="live alt" id="live">LIVE</span>
  <span class="alter" id="alter">Daten werden geladen …</span>
  <span class="uhren"><span><b id="uhr-utc">--:--:--</b> UTC</span><span><b id="uhr-lokal">--:--:--</b> Ortszeit</span></span>
</header>

<main class="haupt">
  <section class="kartenbereich" aria-label="Karte">
    <div class="leiste">
      <h2 class="titel">Globale Lage</h2>
      <div class="gruppe" role="group" aria-label="Kartenansicht">
        <button data-projektion="mercator" aria-pressed="true" title="Flache Karte">2D</button>
        <button data-projektion="globe" aria-pressed="false" title="Globus">3D</button>
      </div>
    </div>
    <div class="karte-huelle">
      <div id="karte"></div>
      <div class="gruppe zeitfilter" id="zeitfilter" role="group" aria-label="Zeitraum"></div>
      <div class="kartenknoepfe">
        <button id="zoom-rein" aria-label="Hineinzoomen" title="Hineinzoomen">+</button>
        <button id="zoom-raus" aria-label="Herauszoomen" title="Herauszoomen">−</button>
        <button id="weltansicht" aria-label="Weltansicht" title="Weltansicht">⌂</button>
      </div>
      <div class="ebenen">
        <button class="ebenen-kopf" aria-expanded="true" aria-controls="ebenen-liste">EBENEN</button>
        <ul id="ebenen-liste"></ul>
      </div>
      <div class="legende" aria-label="Legende">
        <b>LEGENDE</b>
        <span style="--f: var(--hoch)">Hoch</span>
        <span style="--f: var(--erhoeht)">Erhöht</span>
        <span style="--f: var(--beobachtung)">Beobachtung</span>
      </div>
    </div>
  </section>

  <!-- Rechte Spalte: weitere Panels einfach als neue <section class="panel"> darunter setzen. -->
  <aside class="spalte">
    <section class="panel">
      <h2><button class="panel-kopf" aria-expanded="true" aria-controls="nachrichten-inhalt">LIVE-NACHRICHTEN <span class="zahl" id="nachrichten-zahl"></span></button></h2>
      <div id="nachrichten-inhalt">
        <div class="gruppe filter" id="nachrichten-filter" role="group" aria-label="Nachrichten filtern">
          <button data-filter="alle" aria-pressed="true">Alle</button>
          <button data-filter="de" aria-pressed="false">Deutsch</button>
          <button data-filter="int" aria-pressed="false">International</button>
          <button data-filter="hoch" aria-pressed="false">Nur hoch</button>
        </div>
        <ol class="neueste nachrichten" id="nachrichten-liste"></ol>
      </div>
    </section>
    <section class="panel">
      <h2><button class="panel-kopf" aria-expanded="true" aria-controls="maerkte-inhalt">MÄRKTE</button></h2>
      <div id="maerkte-inhalt">
        <div class="gruppe filter" id="maerkte-reiter" role="group" aria-label="Märkte"></div>
        <ul class="maerkte" id="maerkte-liste"></ul>
        <p class="kleingedruckt" id="maerkte-stand"></p>
      </div>
    </section>
    <section class="panel">
      <h2><button class="panel-kopf" aria-expanded="true" aria-controls="neueste">NEUESTE EREIGNISSE <span class="zahl" id="neueste-zahl"></span></button></h2>
      <ol class="neueste" id="neueste"></ol>
    </section>
  </aside>
</main>

<script>
// Alle Ebenen der Karte. Neue Ebene = neuer Eintrag hier (+ Quelle im Daten-Skript).
// form: Zeichen aus FORMEN ('flaeche' = Länder einfärben über das Feld "land"). skala: Größe nach "wert" (Paare wert, Größe).
// deckkraft: für große, durchsichtige Kreise. cluster: nahe Punkte zu Zahlenblasen. liste: false = nicht in "Neueste Ereignisse".
// Spätere Ebenen liegen oben.
const EBENEN = [
  {
    id: 'konfliktzonen', name: 'Konfliktzonen', datei: 'data/konfliktzonen.json', form: 'flaeche', standardAn: true, liste: false,
    quelle: 'eigene Liste, Grenzen: Natural Earth',
    info: 'Länder mit laufenden bewaffneten Konflikten, eingefärbt nach Stufe. Die Liste wird von Hand gepflegt (config/konfliktzonen.json); wann sie zuletzt geprüft wurde, steht im Popup.',
  },
  {
    id: 'brennpunkte', name: 'Brennpunkte', datei: 'data/brennpunkte.json', form: 'kreis', standardAn: true, liste: false,
    skala: [8, 14, 30, 24, 80, 40], deckkraft: 0.25, quelle: 'Auswertung der Nachrichten',
    info: 'Länder, über die in den letzten 24 Stunden besonders viel berichtet wurde. Jede Meldung zählt je nach Stufe 3, 2 oder 1 Punkt. Je mehr Punkte, desto größer der Kreis.',
  },
  {
    id: 'nachrichten', name: 'Nachrichten', datei: 'data/nachrichten.json', form: 'meldung', standardAn: true, liste: false, cluster: true,
    quelle: 'tagesschau, DW, SPIEGEL, BBC, Al Jazeera, The Guardian, France 24, UN News',
    info: 'Meldungen deutscher und internationaler Nachrichtenseiten aus den letzten 48 Stunden, an dem Ort, der in der Meldung genannt wird. Die Zuordnung passiert automatisch und kann danebenliegen. Mehrere Meldungen nah beieinander werden zu einer Zahlenblase.',
  },
  {
    id: 'erdbeben', name: 'Erdbeben', datei: 'data/erdbeben.json', form: 'kreis', standardAn: true, quelle: 'USGS',
    skala: [2.5, 3, 5, 6, 7, 12, 9, 20],
    info: 'Erdbeben ab Stärke 2,5 weltweit aus den letzten 7 Tagen. Je größer der Punkt, desto stärker das Beben. Ab 5 erhöht, ab 6 hoch.',
  },
  {
    id: 'waldbraende', name: 'Waldbrände', datei: 'data/waldbraende.json', form: 'flamme', standardAn: false, quelle: 'NASA EONET',
    info: 'Größere Wald- und Flächenbrände, die die NASA in den letzten 30 Tagen erfasst hat. Laufende Brände bleiben bei jedem Zeitraum sichtbar. Gefährliche Brände zeigt zusätzlich die Ebene Katastrophen-Warnungen.',
  },
  {
    id: 'stuerme', name: 'Stürme', datei: 'data/stuerme.json', form: 'wirbel', standardAn: true, quelle: 'NASA EONET',
    skala: [34, 0.6, 64, 0.8, 140, 1.2],
    info: 'Wirbelstürme und schwere Stürme, die die NASA gerade verfolgt, an ihrer letzten gemeldeten Position. Je größer das Zeichen, desto stärker der Wind. Ab 63 km/h erhöht, ab 119 km/h (Orkan) hoch.',
  },
  {
    id: 'vulkane', name: 'Vulkane', datei: 'data/vulkane.json', form: 'dreieck', standardAn: true, quelle: 'NASA EONET',
    info: 'Vulkane, die laut NASA gerade aktiv sind. Viele brechen über Monate oder Jahre immer wieder aus, darum bleiben sie bei jedem Zeitraum sichtbar.',
  },
  {
    id: 'ueberschwemmungen', name: 'Überschwemmungen', datei: 'data/ueberschwemmungen.json', form: 'tropfen', standardAn: false, quelle: 'NASA EONET',
    info: 'Überschwemmungen, die die NASA gerade verfolgt. Oft leer, weil die NASA Fluten schnell wieder abschließt. Aktuelle Flutwarnungen zeigt die Ebene Katastrophen-Warnungen.',
  },
  {
    id: 'gdacs', name: 'Katastrophen-Warnungen', datei: 'data/gdacs.json', form: 'warnung', standardAn: true, quelle: 'GDACS',
    info: 'Warnungen des Katastrophen-Warnsystems von UN und EU: Erdbeben, Tropenstürme, Überschwemmungen, Vulkane, Dürren und Waldbrände, die Menschen gefährden können. Rot = hoch, Orange = erhöht, Grün = Beobachtung. Grüne Waldbrand-Meldungen sind ausgeblendet, es sind meist über hundert.',
  },
  {
    id: 'boersenplaetze', name: 'Börsenplätze', datei: 'data/boersenplaetze.json', form: 'kreis', standardAn: false, liste: false, quelle: 'Yahoo Finance',
    info: 'Die großen Börsen (Frankfurt, New York, London, Tokio, Hongkong), gefärbt nach der Tagesveränderung ihres wichtigsten Index: Grün = im Plus, Rot = im Minus, Grau = keine Daten. Diese Farben sind keine Warnstufen. Kurse sind verzögert.',
  },
];
// Zeichen im 24er-Raster (SVG-Pfade): im Ebenen-Panel als SVG, auf der Karte als Bild je Stufe.
const FORMEN = {
  kreis: 'M4 12a8 8 0 1 1 16 0a8 8 0 1 1-16 0z',
  flamme: 'M12 1.5c.6 4 6.5 6 6.5 12.5a6.5 6.5 0 0 1-13 0c0-3.2 1.8-5.2 3.1-7 .1 2.3 1.1 3.6 2.6 3.9C10.6 7.5 10.4 4.5 12 1.5z',
  wirbel: 'M7.5 12a4.5 4.5 0 1 1 9 0a4.5 4.5 0 1 1-9 0zM10 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0zM7.6 11C7.6 6 12 2.5 18.5 2.5C14.8 3.8 12.6 5.6 12.2 7.6zM16.4 13C16.4 18 12 21.5 5.5 21.5C9.2 20.2 11.4 18.4 11.8 16.4z',
  dreieck: 'M2 21 9.5 7h5L22 21z',
  tropfen: 'M12 2C9 7 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-4-8-7-13z',
  warnung: 'M12 1.5 23 21.5H1zM11 8.5v7h2v-7zM11 17v2.5h2V17z', // gegenläufige Teilpfade (Auge, Ausrufezeichen) = Loch
  meldung: 'M2.5 3.5h19v13H10l-5 4.5v-4.5H2.5z',
  flaeche: 'M2 5.5 8.5 3l7 2.5L22 3v15.5L15.5 21l-7-2.5L2 21z',
};
const CLUSTER_BIS = 16; // bis zu diesem Zoom fassen Nachrichten-Ebenen nahe Punkte zusammen
const LISTE_AB = 7;     // müsste man für eine Zahlenblase weiter hineinzoomen, zeigt der Klick gleich die Liste (Orte sind nur stadtgenau)
const STUFEN = ['hoch', 'erhoeht', 'beobachtung'];
const ZEITRAEUME = [['1h', 1], ['6h', 6], ['24h', 24], ['48h', 48], ['7d', 168], ['Alle', Infinity]];
const NEU_LADEN_MIN = 5;
const LIVE_GRENZE_MIN = 90;
const SPEICHER = 'weltkarte-ebenen';
const REITER_SPEICHER = 'weltkarte-maerkte-reiter';

const daten = {};       // Ebenen-ID -> Einträge, oder null wenn die Datei fehlt
const eintragNach = new Map(); // "ebene|id" -> Eintrag (für Klicks)
let grenzen = null;     // Ländercode -> Umriss, für Ebenen mit form 'flaeche'
let status = null;
let maerkte = null;
let reiter = null;
try { reiter = localStorage.getItem(REITER_SPEICHER); } catch {}
let stunden = 24;
let nachrichtenFilter = 'alle';
let popup = null;
const NACHRICHTEN_FILTER = { alle: () => true, de: m => m.sprache === 'de', int: m => m.sprache !== 'de', hoch: m => m.stufe === 'hoch' };
const istLink = u => /^https?:\/\//.test(u || '');
const an = gemerkteEbenen();
const farbe = name => getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim();
const $ = id => document.getElementById(id);

function gemerkteEbenen() {
  let gespeichert = {};
  try { gespeichert = JSON.parse(localStorage.getItem(SPEICHER)) || {}; } catch {}
  return Object.fromEntries(EBENEN.map(e => [e.id, gespeichert[e.id] ?? e.standardAn]));
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z]));
}

function vor(ms) {
  const min = Math.floor((Date.now() - ms) / 60000);
  if (min < 1) return 'gerade eben';
  if (min < 60) return `vor ${min} Min.`;
  if (min < 48 * 60) return `vor ${Math.floor(min / 60)} Std.`;
  const tage = Math.floor(min / 1440);
  if (tage < 60) return `vor ${tage} Tagen`;
  return tage < 730 ? `vor ${Math.floor(tage / 30)} Monaten` : `vor ${Math.floor(tage / 365)} Jahren`;
}

// ---- Karte ----
let projektion = 'mercator';
// Zoom, bei dem die ganze Welt passt. Der Globus braucht mehr, sonst ist er winzig.
function weltZoom() {
  const k = $('karte');
  return projektion === 'globe'
    ? Math.log2(Math.min(k.clientWidth, k.clientHeight) * 2.6 / 512)
    : Math.max(0, Math.log2(k.clientWidth / 512));
}
const map = new maplibregl.Map({
  container: 'karte',
  style: 'https://tiles.openfreemap.org/styles/dark',
  center: [20, 25],
  zoom: weltZoom(),
  attributionControl: { customAttribution: [...new Set(EBENEN.map(e => e.quelle))].join(', ') },
  locale: { 'Popup.Close': 'Schließen', 'AttributionControl.ToggleAttribution': 'Quellenangaben ein/aus' },
});

map.on('load', () => {
  // Ortsnamen auf Deutsch, wo vorhanden
  for (const l of map.getStyle().layers) {
    const feld = l.type === 'symbol' && l.layout?.['text-field'];
    if (feld && JSON.stringify(feld).includes('name')) {
      map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:de'], ['get', 'name:latin'], ['get', 'name']]);
    }
  }
  // Jede Form einmal pro Stufe als Bild, doppelt aufgelöst, mit dunklem Rand wie bei den Kreisen
  for (const [form, pfad] of Object.entries(FORMEN)) for (const stufe of STUFEN) {
    const ctx = Object.assign(document.createElement('canvas'), { width: 52, height: 52 }).getContext('2d');
    ctx.setTransform(2, 0, 0, 2, 2, 2);
    const p = new Path2D(pfad);
    Object.assign(ctx, { lineWidth: 2, lineJoin: 'round', strokeStyle: 'rgba(0,0,0,.7)', fillStyle: farbe(stufe) });
    ctx.stroke(p);
    ctx.fill(p);
    map.addImage(`${form}-${stufe}`, ctx.getImageData(0, 0, 52, 52), { pixelRatio: 2 });
  }
  const groesse = (skala, sonst) => skala ? ['case', ['has', 'wert'], ['interpolate', ['linear'], ['get', 'wert'], ...skala], sonst] : sonst;
  // Optionales Feld "farbe" (z. B. Börsenplätze: plus/minus/grau) geht vor der Stufe
  const stufenFarbe = ['match', ['coalesce', ['get', 'farbe'], ['get', 'stufe']], 'hoch', farbe('hoch'), 'erhoeht', farbe('erhoeht'),
    'plus', farbe('plus'), 'minus', farbe('minus'), 'grau', farbe('grau'), farbe('beobachtung')];
  const zaehlen = stufe => ['+', ['case', ['==', ['get', 'stufe'], stufe], 1, 0]];
  const unterNamen = map.getStyle().layers.find(l => l.type === 'symbol')?.id; // Flächen unter die Ortsnamen der Grundkarte
  for (const eb of EBENEN) {
    map.addSource(eb.id, {
      type: 'geojson', data: { type: 'FeatureCollection', features: [] },
      ...(eb.cluster && { cluster: true, clusterRadius: 40, clusterMaxZoom: CLUSTER_BIS, clusterProperties: { hoch: zaehlen('hoch'), erhoeht: zaehlen('erhoeht') } }),
    });
    const nurEinzelne = eb.cluster ? { filter: ['!', ['has', 'point_count']] } : {};
    if (eb.form === 'flaeche') {
      map.addLayer({ id: eb.id, type: 'fill', source: eb.id, paint: { 'fill-color': stufenFarbe, 'fill-opacity': 0.25 } }, unterNamen);
      map.addLayer({ id: eb.id + '-rand', type: 'line', source: eb.id, paint: { 'line-color': stufenFarbe, 'line-opacity': 0.6, 'line-width': 1 } }, unterNamen);
    } else map.addLayer(eb.form === 'kreis' ? {
      id: eb.id, type: 'circle', source: eb.id, ...nurEinzelne,
      paint: {
        'circle-color': stufenFarbe,
        'circle-radius': groesse(eb.skala, 5),
        'circle-opacity': eb.deckkraft ?? 0.8,
        'circle-stroke-width': 1,
        'circle-stroke-color': eb.deckkraft ? stufenFarbe : 'rgba(0,0,0,.6)',
      },
      layout: { 'circle-sort-key': ['coalesce', ['get', 'wert'], 0] },
    } : {
      id: eb.id, type: 'symbol', source: eb.id, ...nurEinzelne,
      paint: { 'icon-opacity': 0.9 },
      layout: {
        'icon-image': ['concat', eb.form, '-', ['get', 'stufe']],
        'icon-size': groesse(eb.skala, 0.7),
        'icon-allow-overlap': true,
        'icon-ignore-placement': true,
        'symbol-sort-key': ['match', ['get', 'stufe'], 'hoch', 2, 'erhoeht', 1, 0], // Rot oben
      },
    });
    if (eb.cluster) {
      // Zahlenblase in der Farbe der schlimmsten Meldung darin
      map.addLayer({
        id: eb.id + '-haufen', type: 'circle', source: eb.id, filter: ['has', 'point_count'],
        paint: {
          'circle-color': ['case', ['>', ['get', 'hoch'], 0], farbe('hoch'), ['>', ['get', 'erhoeht'], 0], farbe('erhoeht'), farbe('beobachtung')],
          'circle-radius': ['interpolate', ['linear'], ['get', 'point_count'], 2, 10, 40, 20],
          'circle-opacity': 0.85,
          'circle-stroke-width': 2,
          'circle-stroke-color': 'rgba(0,0,0,.6)',
        },
      });
      map.addLayer({
        id: eb.id + '-zahl', type: 'symbol', source: eb.id, filter: ['has', 'point_count'],
        layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Noto Sans Bold'], 'text-size': 11, 'text-allow-overlap': true },
        paint: { 'text-color': '#000' },
      });
    }
  }
  // Ein Klick-Handler für alle Ebenen: queryRenderedFeatures liefert das oberste Zeichen zuerst
  const klickbar = EBENEN.flatMap(eb => eb.cluster ? [eb.id, eb.id + '-haufen'] : [eb.id]);
  map.on('click', e => {
    const f = map.queryRenderedFeatures(e.point, { layers: klickbar })[0];
    if (f?.properties.cluster) haufenOeffnen(f);
    else if (f) oeffnen(eintragNach.get(f.properties.key), f.layer.type === 'fill' && e.lngLat);
  });
  for (const id of klickbar) {
    map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
  }
  zeichnen();
});

// wo: Klickpunkt bei Flächen (sonst stünde das Popup für Russland in Moskau)
function oeffnen(e, wo) {
  if (!e) return;
  popup?.remove();
  const t = Date.parse(e.zeit);
  const flaeche = EBENEN.find(eb => eb.id === e.ebene)?.form === 'flaeche';
  const link = istLink(e.link) ? `<p><a href="${esc(e.link)}" target="_blank" rel="noopener">${e.ebene === 'nachrichten' ? 'Artikel' : 'Quelle'} öffnen ↗</a></p>` : '';
  popup = new maplibregl.Popup({ maxWidth: '320px', className: 'popup' })
    .setLngLat(wo || [e.lon, e.lat])
    .setHTML(`<h3 style="--f:${farbe(e.farbe || e.stufe)}">${esc(e.titel)}</h3>
      <p class="zeit">${flaeche ? `Stand: ${new Date(t).toLocaleDateString('de-DE')}`
        : `${e.laufend ? `läuft noch, zuletzt aktualisiert ${vor(t)}` : vor(t)} · ${new Date(t).toLocaleString('de-DE')}`}</p>
      ${e.text ? `<p>${esc(e.text)}</p>` : ''}
      <p class="quelle">Quelle: ${esc(e.quelle)}</p>${link}`)
    .addTo(map);
}

// Zahlenblase: hineinzoomen, bis sie zerfällt. Liegen die Meldungen (fast) am selben Ort, hilft Zoomen nicht: dann als Liste.
async function haufenOeffnen(f) {
  const quelle = map.getSource(f.layer.source);
  const id = f.properties.cluster_id;
  const zoom = await quelle.getClusterExpansionZoom(id);
  if (zoom <= LISTE_AB) return map.easeTo({ center: f.geometry.coordinates, zoom });
  const liste = (await quelle.getClusterLeaves(id, 100, 0))
    .map(b => eintragNach.get(b.properties.key)).filter(Boolean).sort((a, b) => b.t - a.t);
  popup?.remove();
  popup = new maplibregl.Popup({ maxWidth: '340px', className: 'popup' })
    .setLngLat(f.geometry.coordinates)
    .setHTML(`<h3 style="--f:${farbe(STUFEN.find(s => liste.some(e => e.stufe === s)) || 'beobachtung')}">${f.properties.point_count} Meldungen an diesem Ort</h3>
      <ul class="haufen">${liste.map(e => `<li>${istLink(e.link)
        ? `<a href="${esc(e.link)}" target="_blank" rel="noopener" style="--f:${farbe(e.stufe)}">${esc(e.titel)} ↗</a>`
        : `<a style="--f:${farbe(e.stufe)}">${esc(e.titel)}</a>`}<span>${esc(e.quelle)} · ${vor(e.t)}</span></li>`).join('')}</ul>`)
    .addTo(map);
}

// ---- Daten laden und anzeigen ----
async function laden() {
  const t = Date.now(); // ?t= umgeht Browser- und GitHub-Cache
  await Promise.all(EBENEN.map(async eb => {
    try {
      const res = await fetch(`${eb.datei}?t=${t}`);
      if (!res.ok) throw new Error(res.status);
      daten[eb.id] = (await res.json()).eintraege.map(e => ({ ...e, ebene: eb.id, t: Date.parse(e.zeit) }));
    } catch {
      daten[eb.id] = null;
    }
  }));
  try {
    const res = await fetch(`data/status.json?t=${t}`);
    status = res.ok ? await res.json() : null;
  } catch {
    status = null;
  }
  maerkte = await fetch(`data/maerkte.json?t=${t}`).then(r => r.ok ? r.json() : null).catch(() => null);
  // Ländergrenzen nur einmal laden (ändern sich nicht); klappt es nicht, beim nächsten Mal erneut
  grenzen ||= await fetch('config/laender.geojson').then(r => r.json())
    .then(g => Object.fromEntries(g.features.map(f => [f.properties.ADM0_A3, f.geometry]))).catch(() => null);
  eintragNach.clear();
  for (const eb of EBENEN) for (const e of daten[eb.id] || []) eintragNach.set(`${eb.id}|${e.id}`, e);
  zeichnen();
  maerkteZeichnen();
  uhr();
}

function zeichnen() {
  const grenze = Date.now() - stunden * 3600e3;
  const neueste = [];
  for (const eb of EBENEN) {
    const sichtbar = (daten[eb.id] || []).filter(e => e.laufend || e.t >= grenze);
    const zeile = document.querySelector(`.ebene[data-id="${eb.id}"]`);
    zeile.classList.toggle('leer', !daten[eb.id]);
    zeile.querySelector('.anzahl').textContent = daten[eb.id] ? sichtbar.length : 'keine Daten';
    map.getSource(eb.id)?.setData({
      type: 'FeatureCollection',
      features: (an[eb.id] ? sichtbar : []).map(e => ({
        type: 'Feature',
        // Nachrichten ohne erkannten Ort stehen nur in der Liste
        geometry: eb.form === 'flaeche' ? grenzen?.[e.land] : e.lat != null && { type: 'Point', coordinates: [e.lon, e.lat] },
        properties: { key: `${eb.id}|${e.id}`, stufe: e.stufe, ...(e.wert != null && { wert: e.wert }), ...(e.farbe && { farbe: e.farbe }) },
      })).filter(f => f.geometry),
    });
    if (an[eb.id] && eb.liste !== false) neueste.push(...sichtbar);
  }
  neueste.sort((a, b) => b.t - a.t);
  $('neueste-zahl').textContent = neueste.length;
  $('neueste').innerHTML = neueste.slice(0, 30).map(e => `<li><button class="ereignis" style="--f:${farbe(e.stufe)}" data-key="${esc(e.ebene + '|' + e.id)}">
      ${esc(e.titel)}<span>${e.laufend ? 'läuft · ' : ''}${vor(e.t)} · ${esc(e.quelle)}</span></button></li>`).join('')
    || '<li class="leer-hinweis">Keine Ereignisse im gewählten Zeitraum.</li>';

  // Live-Nachrichten: gleicher Zeitraum wie die Karte, unabhängig davon, ob die Ebene an ist
  const meldungen = (daten.nachrichten || []).filter(m => m.t >= grenze && NACHRICHTEN_FILTER[nachrichtenFilter](m));
  $('nachrichten-zahl').textContent = meldungen.length;
  $('nachrichten-liste').innerHTML = meldungen.map(m => {
    const inhalt = `${esc(m.titel)}<span>${esc(m.quelle)} · ${vor(m.t)}${m.lat == null ? ' · ohne Ort' : ''}</span>`;
    const stil = `class="ereignis meldung" style="--f:${farbe(m.stufe)}"`;
    // Mit Ort: Karte fliegt hin. Ohne Ort: direkt zum Artikel.
    return `<li>${m.lat != null ? `<button ${stil} data-key="${esc('nachrichten|' + m.id)}">${inhalt}</button>`
      : istLink(m.link) ? `<a ${stil} href="${esc(m.link)}" target="_blank" rel="noopener">${inhalt}</a>` : `<div ${stil}>${inhalt}</div>`}</li>`;
  }).join('') || `<li class="leer-hinweis">${daten.nachrichten ? 'Keine Meldungen im gewählten Zeitraum.' : 'Keine Daten.'}</li>`;
}

// ---- Märkte ----
const zahl = (x, stellen) => x.toLocaleString('de-DE', { minimumFractionDigits: stellen, maximumFractionDigits: stellen });

// Mini-Verlauf als Linie, Höhe auf Minimum bis Maximum gestreckt
function verlaufSvg(werte, f) {
  if (!(werte?.length >= 2)) return '<span></span>';
  const min = Math.min(...werte), spanne = Math.max(...werte) - min || 1;
  const punkte = werte.map((w, i) => `${(i / (werte.length - 1) * 56).toFixed(1)},${(17 - (w - min) / spanne * 16).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 56 18" aria-hidden="true"><polyline points="${punkte}" stroke="${f}"/></svg>`;
}

function maerkteZeichnen() {
  const werte = maerkte?.werte || [];
  const gruppen = [...new Set(werte.map(w => w.gruppe))];
  if (!gruppen.includes(reiter)) reiter = gruppen[0];
  $('maerkte-reiter').innerHTML = gruppen.map(g => `<button data-reiter="${esc(g)}" aria-pressed="${g === reiter}">${esc(g)}</button>`).join('');
  $('maerkte-liste').innerHTML = werte.filter(w => w.gruppe === reiter && w.kurs != null).map(w => {
    const a = w.aenderungProzent;
    const art = a > 0 ? 'plus' : a < 0 ? 'minus' : 'grau';
    return `<li class="wert"><span>${esc(w.name)}</span>${verlaufSvg(w.verlauf, farbe(art))}
      <span class="kurs">${zahl(w.kurs, w.kurs < 10 ? 4 : 2)} <small>${esc(w.waehrung)}</small></span>
      <span class="aenderung ${art}">${a == null ? '–' : `${a > 0 ? '▲' : a < 0 ? '▼' : ''} ${zahl(Math.abs(a), 2)} %`}</span></li>`;
  }).join('') || '<li class="leer-hinweis">Keine Daten.</li>';
  const stand = Date.parse(maerkte?.aktualisiert);
  $('maerkte-stand').textContent = `Kurse verzögert${stand ? `, Stand ${new Date(stand).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}` : ''}`
    + ' · Quelle: Yahoo Finance · keine Anlageberatung';
}

function uhr() {
  const jetzt = new Date();
  $('uhr-utc').textContent = jetzt.toISOString().slice(11, 19);
  $('uhr-lokal').textContent = jetzt.toLocaleTimeString('de-DE');
  const stand = Date.parse(status?.aktualisiert);
  $('alter').textContent = stand ? `Daten von ${vor(stand)}` : 'Keine Daten';
  $('live').classList.toggle('alt', !(Date.now() - stand < LIVE_GRENZE_MIN * 60000));
}

// ---- Bedienelemente ----
$('ebenen-liste').innerHTML = EBENEN.map(eb => `<li class="ebene" data-id="${eb.id}">
    <label><input type="checkbox" ${an[eb.id] ? 'checked' : ''}><svg viewBox="-1 -1 26 26" aria-hidden="true"><path d="${FORMEN[eb.form]}"/></svg>${esc(eb.name)}</label>
    <span class="anzahl">…</span>
    <button class="info-knopf" aria-label="Info zu ${esc(eb.name)}" aria-expanded="false" aria-controls="info-${eb.id}">i</button>
    <p class="info-text" id="info-${eb.id}" hidden>${esc(eb.info)} Quelle: ${esc(eb.quelle)}.</p>
  </li>`).join('');

$('ebenen-liste').addEventListener('change', e => {
  an[e.target.closest('.ebene').dataset.id] = e.target.checked;
  try { localStorage.setItem(SPEICHER, JSON.stringify(an)); } catch {}
  zeichnen();
});

$('zeitfilter').innerHTML = ZEITRAEUME.map(([text, h]) => `<button data-stunden="${h}" aria-pressed="${h === stunden}">${text}</button>`).join('');
$('zeitfilter').addEventListener('click', e => {
  const knopf = e.target.closest('button');
  if (!knopf) return;
  stunden = Number(knopf.dataset.stunden);
  for (const b of $('zeitfilter').children) b.setAttribute('aria-pressed', b === knopf);
  zeichnen();
});

document.querySelector('[aria-label="Kartenansicht"]').addEventListener('click', e => {
  const knopf = e.target.closest('button');
  if (!knopf) return;
  projektion = knopf.dataset.projektion;
  map.setProjection({ type: projektion });
  if (map.getZoom() < weltZoom()) map.easeTo({ zoom: weltZoom() });
  for (const b of knopf.parentElement.children) b.setAttribute('aria-pressed', b === knopf);
});

$('zoom-rein').onclick = () => map.zoomIn();
$('zoom-raus').onclick = () => map.zoomOut();
$('weltansicht').onclick = () => map.flyTo({ center: [20, 25], zoom: weltZoom() });

$('nachrichten-filter').addEventListener('click', e => {
  const knopf = e.target.closest('button');
  if (!knopf) return;
  nachrichtenFilter = knopf.dataset.filter;
  for (const b of knopf.parentElement.children) b.setAttribute('aria-pressed', b === knopf);
  zeichnen();
});

$('maerkte-reiter').addEventListener('click', e => {
  const knopf = e.target.closest('button');
  if (!knopf) return;
  reiter = knopf.dataset.reiter;
  try { localStorage.setItem(REITER_SPEICHER, reiter); } catch {}
  maerkteZeichnen();
});

// Klick auf Ereignis oder Meldung in der rechten Spalte: Karte fliegt hin und öffnet das Popup
document.querySelector('.spalte').addEventListener('click', ev => {
  const e = eintragNach.get(ev.target.closest('.ereignis')?.dataset.key);
  if (!e) return;
  if (matchMedia('(max-width: 799px)').matches) $('karte').scrollIntoView({ behavior: 'smooth' });
  map.flyTo({ center: [e.lon, e.lat], zoom: Math.max(map.getZoom(), 4) });
  oeffnen(e);
});

// Ein- und Ausklappen für alles mit aria-controls (Ebenen-Panel, Panels, "i"-Knöpfe)
document.addEventListener('click', e => {
  const knopf = e.target.closest('button[aria-controls]');
  if (!knopf) return;
  const ziel = $(knopf.getAttribute('aria-controls'));
  ziel.hidden = !ziel.hidden;
  knopf.setAttribute('aria-expanded', !ziel.hidden);
});

// Auf dem Handy startet das Ebenen-Panel zugeklappt
if (matchMedia('(max-width: 799px)').matches) document.querySelector('.ebenen-kopf').click();

laden();
setInterval(laden, NEU_LADEN_MIN * 60000);
setInterval(uhr, 1000);
</script>
</body>
</html>
